[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "doc2pages"
version = "0.1.0"
description = "Turn PDF, Word, PowerPoint and text files into structured learning web pages with any OpenAI-compatible model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Hamid Mergan" }]
keywords = ["learning", "e-learning", "html", "markdown", "pdf", "llm", "ollama", "openai"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
    "Topic :: Text Processing :: Markup :: HTML",
    "Typing :: Typed",
]
dependencies = [
    "openai>=1.30",
    "pypdfium2>=4.30",
    "python-docx>=1.1",
    "python-pptx>=0.6.23",
    "Pillow>=10.0",
    "langdetect>=1.0.9",
]

[project.optional-dependencies]
ui = ["fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6"]
test = ["pytest>=7", "httpx>=0.24", "fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6"]
dev = ["pytest>=7", "httpx>=0.24", "fastapi>=0.100", "uvicorn>=0.23", "python-multipart>=0.0.6", "build", "twine"]

[project.urls]
Homepage = "https://github.com/hamidmergan/doc2pages"
Source = "https://github.com/hamidmergan/doc2pages"
Issues = "https://github.com/hamidmergan/doc2pages/issues"
Changelog = "https://github.com/hamidmergan/doc2pages/blob/main/CHANGELOG.md"

[project.scripts]
doc2pages = "doc2pages.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
doc2pages = ["py.typed", "assets/*", "web/static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
